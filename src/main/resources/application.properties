# Import .env file
spring.config.import=optional:file:.env[.properties]

# Datasource configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}
application.security.jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test-pass
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

application.security.refresh.cookie-name=${APPLICATION_SECURITY_REFRESH_COOKIE_NAME}
application.security.refresh.ttl-seconds=${APPLICATION_SECURITY_REFRESH_TTL_SECONDS}
application.security.refresh.cookie-domain=${APPLICATION_SECURITY_REFRESH_COOKIE_DOMAIN}
application.security.refresh.cookie-secure=${APPLICATION_SECURITY_REFRESH_COOKIE_SECURE}
application.security.refresh.cookie-samesite=${APPLICATION_SECURITY_REFRESH_COOKIE_SAMESITE}